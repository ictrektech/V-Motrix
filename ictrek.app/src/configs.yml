configs:
  - name: VOS_MOTRIX_DOWNLOAD_PUBLIC_PATH
    type: path
    title:
      zh-CN: V-Motrix 共享下载目录
      en: V-Motrix Shared Download Directory
    description:
      zh-CN: V-Motrix 下载文件的公共目录。应用会在其中按 VOS 用户名创建隔离子目录；界面显示为 /downloads/<用户名>。
      en: Public directory for V-Motrix downloads. The app creates isolated per-VOS-username subdirectories in this directory while the UI displays /downloads/<username>.
    default: /data/vos_workspace/v-motrix/downloads
    hints: [com.ictrek.v-motrix.download.storage]
  - name: VOS_OIDC_USERINFO_URL
    type: string
    title:
      zh-CN: VOS OIDC 用户信息地址
      en: VOS OIDC Userinfo URL
    description:
      zh-CN: V-Motrix 后端用于校验 Fastpath access token 的 VOS userinfo 地址。
      en: VOS userinfo endpoint used by V-Motrix to verify Fastpath access tokens.
    default: http://172.17.0.1:8105/v1000/oauth2/userinfo
